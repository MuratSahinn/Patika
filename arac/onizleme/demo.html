<script>
/* ÖNİZLEME: sahte Supabase (sadece bu önizleme kopyasında; repodaki index.html'de yok) */
(function(){
  var U='https://onizleme.patika.test', K='onizleme';
  try{ localStorage.setItem('patika:sosyal', JSON.stringify({url:U, key:K})); }catch(e){}
  var db={ users:{}, profiles:{} };
  try{ db = JSON.parse(localStorage.getItem('patika:onizleme-db')) || db; }catch(e){}
  function kaydet(){ try{ localStorage.setItem('patika:onizleme-db', JSON.stringify(db)); }catch(e){} }
  function res(st, data){ return new Promise(function(r){ setTimeout(function(){ r({ ok:st>=200&&st<300, status:st, json:function(){ return Promise.resolve(data); } }); }, 350); }); }
  var gercek = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function(u, o){
    u = String(u); o = o||{};
    if(u.indexOf(U)!==0) return gercek ? gercek(u, o) : Promise.reject(new Error('yok'));
    var p = u.slice(U.length), b = o.body ? JSON.parse(o.body) : null;
    if(p==='/auth/v1/otp') return res(200,{});
    if(p==='/auth/v1/verify'){
      if(b.token!=='123456') return res(403,{msg:'Token has expired or is invalid'});
      var id='demo-'+b.email.toLowerCase(); db.users[id]={email:b.email}; kaydet();
      return res(200,{ access_token:'at-'+id, refresh_token:'rt-'+id, expires_in:86400, user:{id:id, email:b.email} });
    }
    if(p.indexOf('/auth/v1/token')===0) return res(200,{ access_token:'at-'+b.refresh_token.slice(3), refresh_token:b.refresh_token, expires_in:86400, user:{ id:b.refresh_token.slice(3), email:(db.users[b.refresh_token.slice(3)]||{}).email||'' } });
    if(p==='/auth/v1/logout') return res(204,null);
    var uid = ((o.headers||{}).authorization||'').replace('Bearer at-','');
    if(p.indexOf('/rest/v1/profiles')===0){
      if((o.method||'GET')==='GET'){ var m=p.match(/id=eq\.([^&]+)/); var pr=db.profiles[decodeURIComponent(m?m[1]:'')]; return res(200, pr?[pr]:[]); }
      var ad=(b.takma_ad||'').trim().toLowerCase();
      if(ad==='kapadokya kuşu') return res(409,{code:'23505'});
      db.profiles[uid]=Object.assign({}, db.profiles[uid]||{}, b); kaydet(); return res(201,[db.profiles[uid]]);
    }
    if(p==='/rest/v1/rpc/hesabimi_sil'){ delete db.profiles[uid]; delete db.users[uid]; kaydet(); return res(204,null); }
    return res(404,{});
  };
  document.addEventListener('DOMContentLoaded', function(){
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;background:rgba(20,10,14,.88);color:#fff;font:600 12px/1.3 system-ui,sans-serif;padding:8px 12px 8px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;max-width:92vw');
    d.innerHTML='<span>Önizleme · sahte sunucu · giriş kodu <b>123456</b> · Menü → Gezgin Profilim</span><button style="border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;width:22px;height:22px;cursor:pointer" aria-label="Kapat">×</button>';
    d.querySelector('button').onclick=function(){ d.remove(); };
    document.body.appendChild(d);
  });
})();
</script>
